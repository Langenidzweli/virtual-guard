server:
  port: 8090

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  application:
    name: virtual-guard-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  file:
    storage:
      location: ./uploads

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  fastapi:
    base-url: http://localhost:8000
    api-key: ${INTERNAL_API_KEY}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:600}
  bootstrap:
    users-enabled: ${BOOTSTRAP_USERS_ENABLED:false}
    password: ${BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
logging:
  level:
    com.virtualguard: ${APP_LOG_LEVEL:INFO}
