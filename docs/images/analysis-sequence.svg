<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#0a101a"/><text x="55" y="58" fill="#f4f7fb" font-family="Arial" font-size="28" font-weight="700">Video Analysis and Human Review Sequence</text><g font-family="Arial" font-size="16" text-anchor="middle"><g fill="#14243a" stroke="#3b82f6"><rect x="45" y="100" width="180" height="58" rx="10"/><rect x="285" y="100" width="200" height="58" rx="10"/><rect x="550" y="100" width="190" height="58" rx="10"/><rect x="805" y="100" width="170" height="58" rx="10"/><rect x="1025" y="100" width="130" height="58" rx="10"/></g><g fill="#fff"><text x="135" y="135">Officer / Admin</text><text x="385" y="135">React UI</text><text x="645" y="135">Spring Boot</text><text x="890" y="135">FastAPI AI</text><text x="1090" y="135">PostgreSQL</text></g></g><g stroke="#34465f" stroke-dasharray="7 7"><path d="M135 158V670"/><path d="M385 158V670"/><path d="M645 158V670"/><path d="M890 158V670"/><path d="M1090 158V670"/></g><g stroke="#55a7ff" stroke-width="2" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55a7ff"/></marker></defs><path d="M135 205H380"/><path d="M385 255H640"/><path d="M645 305H1085"/><path d="M645 355H885"/><path d="M890 405H650"/><path d="M890 455H650"/><path d="M645 505H1085"/><path d="M385 555H640"/><path d="M645 605H1085"/><path d="M645 650H390"/></g><g fill="#a9bad2" font-family="Arial" font-size="14"><text x="210" y="195">1. Choose camera + video</text><text x="445" y="245">2. POST /api/jobs</text><text x="800" y="295">3. Persist QUEUED job</text><text x="702" y="345">4. POST /analyze</text><text x="694" y="395">5. Progress updates</text><text x="694" y="445">6. Final AI callback</text><text x="790" y="495">7. Save result + incident</text><text x="445" y="545">8. Poll job status</text><text x="790" y="595">9. Human review decision</text><text x="470" y="640">10. Updated map, history and notification</text></g></svg>
