<path d="M765 430 H895" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="830" y="412" text-anchor="middle" font-size="14" fill="#334155">Read / write</text>
<path d="M765 208 H830 V285 H1025 V360" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="982" y="271" text-anchor="middle" font-size="14" fill="#334155">Store / serve</text>
<rect x="40" y="550" width="1120" height="118" rx="12" fill="#e2e8f0"/>
<text x="60" y="581" dy="0" font-size="17" fill="#334155">Deployment: four Docker Compose services; published ports bind to localhost.</text>
<text x="60" y="581" dy="29" font-size="17" fill="#334155">Browser calls the backend directly. Nginx does not proxy the API in this configuration.</text>
<text x="60" y="581" dy="58" font-size="17" fill="#334155">Uploaded recordings only. PostgreSQL stores metadata; media bytes remain on disk.</text>
</g></svg>