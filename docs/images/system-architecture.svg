<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Virtual Guard | System architecture</title><desc id="desc">Nginx serves React assets. The browser calls Spring Boot, which connects to PostgreSQL and FastAPI. Both processing services access shared recordings. FastAPI sends authenticated callbacks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="710" rx="20" fill="#f1f5f9"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="25" font-weight="700" fill="#0f172a">Virtual Guard | System architecture</text>
<rect x="40" y="100" width="260" height="110" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="40" y="115" width="5" height="80" rx="2" fill="#2563eb"/><text x="58" y="130" font-size="19" font-weight="700" fill="#0f172a">React browser</text>
<text x="58" y="157" font-size="15" fill="#475569">Recordings and incident review</text>
<text x="58" y="179" font-size="15" fill="#475569">JWTs and media tickets</text>
<rect x="40" y="295" width="260" height="100" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="40" y="310" width="5" height="70" rx="2" fill="#2563eb"/><text x="58" y="325" font-size="19" font-weight="700" fill="#0f172a">Nginx :80</text>
<text x="58" y="352" font-size="15" fill="#475569">Static frontend assets</text>
<text x="58" y="374" font-size="15" fill="#475569">SPA route fallback</text>
<rect x="435" y="100" width="330" height="130" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="435" y="115" width="5" height="100" rx="2" fill="#2563eb"/><text x="453" y="130" font-size="19" font-weight="700" fill="#0f172a">Spring Boot :8090</text>
<text x="453" y="157" font-size="15" fill="#475569">Authentication and permissions</text>
<text x="453" y="179" font-size="15" fill="#475569">Job state and incident review</text>
<text x="453" y="201" font-size="15" fill="#475569">Application API and playback</text>
<rect x="895" y="100" width="265" height="130" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/><rect x="895" y="115" width="5" height="100" rx="2" fill="#7c3aed"/><text x="913" y="130" font-size="19" font-weight="700" fill="#0f172a">PostgreSQL :5432</text>
<text x="913" y="157" font-size="15" fill="#475569">Accounts and cameras</text>
<text x="913" y="179" font-size="15" fill="#475569">Jobs, results and review notes</text>
<text x="913" y="201" font-size="15" fill="#475569">Persistent database volume</text>
<rect x="435" y="360" width="330" height="140" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="435" y="375" width="5" height="110" rx="2" fill="#0f766e"/><text x="453" y="390" font-size="19" font-weight="700" fill="#0f172a">FastAPI :8000</text>
<text x="453" y="417" font-size="15" fill="#475569">Conversion and video analysis</text>
<text x="453" y="439" font-size="15" fill="#475569">YOLO / tracking / pose</text>
<text x="453" y="461" font-size="15" fill="#475569">Independent motion classifier</text>
<rect x="895" y="360" width="265" height="140" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><rect x="895" y="375" width="5" height="110" rx="2" fill="#b45309"/><text x="913" y="390" font-size="19" font-weight="700" fill="#0f172a">Shared media</text>
<text x="913" y="417" font-size="15" fill="#475569">Original and processed files</text>
<text x="913" y="439" font-size="15" fill="#475569">/data/uploads</text>
<text x="913" y="461" font-size="15" fill="#475569">Host: backend/uploads/</text>
<path d="M300 155 H435" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="367" y="135" text-anchor="middle" font-size="14" fill="#334155">HTTP API</text>
